<head>

<script>
    try {
      var savedTheme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
      document.documentElement.classList.toggle('dark', savedTheme === 'dark');
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.documentElement.style.colorScheme = savedTheme;
    } catch (e) {}
  </script>


  <script>
    // Domínio oficial do aplicativo
    try {
      if (location.hostname === 'evangelizacao-juvenil.vercel.app') {
        location.replace('https://evangelizacao.dynv6.net' + location.pathname + location.search + location.hash);
      }
    } catch (e) {}
  </script>

</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
